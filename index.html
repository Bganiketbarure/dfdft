<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BVNAB Intelligence</title>

<style>
body {
    margin: 0;
    background: #0a0a0a;
    color: white;
    font-family: Arial;
    overflow: hidden;
}

/* CENTER SCENE */
.scene {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1200px;
}

/* CUBE */
.cube {
    width: 200px;
    height: 200px;
    position: relative;
    transform-style: preserve-3d;
    animation: rotate 10s infinite linear;
}

.face {
    position: absolute;
    width: 200px;
    height: 200px;
    background: rgba(209,0,0,0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid white;
    font-weight: bold;
}

/* Cube faces */
.front  { transform: rotateY(0deg) translateZ(100px); }
.back   { transform: rotateY(180deg) translateZ(100px); }
.right  { transform: rotateY(90deg) translateZ(100px); }
.left   { transform: rotateY(-90deg) translateZ(100px); }
.top    { transform: rotateX(90deg) translateZ(100px); }
.bottom { transform: rotateX(-90deg) translateZ(100px); }

/* Rotation */
@keyframes rotate {
    from { transform: rotateX(0) rotateY(0); }
    to { transform: rotateX(360deg) rotateY(360deg); }
}

/* FLOATING TEXT PANELS */
.panel {
    position: absolute;
    color: #ff4d4d;
    font-size: 18px;
    opacity: 0;
    animation: popup 10s infinite;
}

.panel:nth-child(1) { top: 10%; left: 10%; animation-delay: 1s; }
.panel:nth-child(2) { top: 20%; right: 10%; animation-delay: 2s; }
.panel:nth-child(3) { bottom: 20%; left: 15%; animation-delay: 3s; }
.panel:nth-child(4) { bottom: 10%; right: 15%; animation-delay: 4s; }
.panel:nth-child(5) { top: 40%; left: 5%; animation-delay: 5s; }
.panel:nth-child(6) { top: 50%; right: 5%; animation-delay: 6s; }

@keyframes popup {
    0% { opacity: 0; transform: scale(0.5); }
    20% { opacity: 1; transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; }
}

/* BRAND TEXT */
.brand {
    position: absolute;
    bottom: 40px;
    text-align: center;
    width: 100%;
}

.brand h1 {
    margin: 0;
    color: #d10000;
}

.brand p {
    margin: 5px 0 0;
    color: #aaa;
}
</style>
</head>

<body>

<div class="scene">

    <div class="cube">
        <div class="face front">Automation</div>
        <div class="face back">AI Vision</div>
        <div class="face right">Software</div>
        <div class="face left">3D Printing</div>
        <div class="face top">R&D</div>
        <div class="face bottom">Training</div>
    </div>

    <!-- Floating Panels -->
    <div class="panel">Industrial Automation</div>
    <div class="panel">AI Vision Systems</div>
    <div class="panel">Custom Software</div>
    <div class="panel">3D Printing</div>
    <div class="panel">R&D</div>
    <div class="panel">Training & Labs</div>

</div>

<div class="brand">
    <h1>BVNAB Intelligence</h1>
    <p>Engineering Intelligence for Industry 4.0</p>
</div>

</body>
</html>
